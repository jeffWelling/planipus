apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "planipus.fullname" . }}
  labels:
    {{- include "planipus.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  PLANIPUS_HOST: "0.0.0.0"
  PLANIPUS_PORT: "8080"
  PLANIPUS_PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  PLANIPUS_PROVIDER_MODE: {{ .Values.config.providerMode | quote }}
  PLANIPUS_MASTER_KEY_ID: {{ .Values.config.masterKeyId | quote }}
  PLANIPUS_COOKIE_SECURE: "true"
  PLANIPUS_SESSION_TTL_SECONDS: {{ .Values.config.sessionTtlSeconds | quote }}
  PLANIPUS_MIGRATIONS_DIR: "server/migrations"
  PLANIPUS_MIGRATION_ATTEMPTS: {{ .Values.config.migrationAttempts | quote }}
  PLANIPUS_SCHEDULER_INTERVAL_MS: {{ .Values.config.schedulerIntervalMs | quote }}
  PLANIPUS_WORKER_INTERVAL_MS: {{ .Values.config.workerIntervalMs | quote }}
  PLANIPUS_JOB_LEASE_SECONDS: {{ .Values.config.jobLeaseSeconds | quote }}
