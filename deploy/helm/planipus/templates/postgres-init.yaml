{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "planipus.fullname" . }}-postgres-init
  labels:
    {{- include "planipus.labels" . | nindent 4 }}
data:
  10-planipus-app.sh: |
    #!/bin/sh
    set -eu
    psql --set ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" \
      --set=app_user="$PLANIPUS_APP_USERNAME" \
      --set=app_password="$PLANIPUS_APP_PASSWORD" <<'PLANIPUS_SQL'
    SELECT format(
      'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
      :'app_user',
      :'app_password'
    )
    WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
    SELECT format(
      'ALTER ROLE %I PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
      :'app_user',
      :'app_password'
    ) \gexec
    SELECT format('ALTER DATABASE %I OWNER TO %I', current_database(), :'app_user') \gexec
    SELECT format('ALTER SCHEMA public OWNER TO %I', :'app_user') \gexec
    PLANIPUS_SQL
{{- end }}
